[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hrrp-penalties"
version = "0.2.0"
description = "Medicare readmission (HRRP) penalties in dollars: ingestion, SQL models, analysis and reports."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "duckdb>=1.1",
    "requests>=2.31",
    "pandas>=2.1",
    "numpy>=1.26",
    "openpyxl>=3.1",
    "python-dotenv>=1.0",
    "statsmodels>=0.14",
    "scikit-learn>=1.4",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.setuptools]
packages = ["ingest", "models", "analysis", "dashboard"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
# Errors and likely bugs only; style is left as written.
select = ["E9", "F"]
