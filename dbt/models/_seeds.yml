version: 2

seeds:
  - name: state_fips
    description: "USPS state abbreviation to Census state FIPS code (official ANSI/FIPS codes). CMS files use abbreviations, Census uses FIPS."
    columns:
      - name: state_abbr
        description: "Two-letter USPS abbreviation."
        data_tests: [unique, not_null]
      - name: state_fips
        description: "Two-digit Census state FIPS code, as text."
        data_tests: [unique, not_null]
  - name: system_owner_patterns
    description: >
      Hand-built crosswalk from CMS owner organization names to the four public hospital
      companies. CMS never names the ultimate parent, so owner names are matched with
      SQL ILIKE. Starting hypotheses: check qa.system_owner_names against each 10-K.
    columns:
      - name: system
        description: "Parent company name."
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["HCA Healthcare", "Tenet Healthcare", "Community Health Systems", "Universal Health Services"]
      - name: cik
        description: "SEC Central Index Key of the parent company (text)."
      - name: owner_name_pattern
        description: "ILIKE pattern matched against the owner organization name in CMS All Owners."
        data_tests: [unique, not_null]
      - name: note
        description: "Why the pattern is there."
  - name: hrrp_known_breaks
    description: >
      Breaks in the HRRP series that CMS announced, each with the CMS (or CMS contractor)
      page and the sentence that says so. Read by the panel to flag rows, and checked
      against the data by assert_panel_known_breaks_consistent and
      assert_panel_covid_years_match_periods.
    columns:
      - name: fiscal_year
        description: "Payment year the break applies to."
        data_tests: [not_null]
      - name: condition
        description: "Condition code, or empty if it applies to the whole year."
      - name: break_type
        description: "Kind of break."
        data_tests:
          - accepted_values:
              arguments:
                values: ["not_in_program", "methodology_change", "covid_2020_exclusion", "measure_suppressed", "period_length_change"]
      - name: source_url
        description: "CMS page the break was read from."
        data_tests: [not_null]
      - name: source_quote
        description: "The sentence on that page."
