version: 2

# Descriptions for the singular tests; python -m models.build prints them in
# docs/data_quality_report.md next to each result.
data_tests:
  - name: assert_factor_recompute_matches_cms
    description: "recomputed factor (1 - NM x sum of ratio x excess ERR, floor 0.97) matches CMS within 0.0001 for every hospital"
  - name: assert_join_funnel_is_consistent
    description: "join funnel has 7 steps, starts at every HRRP hospital, never grows, ends at the complete rows of mart.hospital"
  - name: assert_supplemental_factor_equals_table15
    description: "supplemental factor equals Table 15 factor"
  - name: assert_at_most_six_hrrp_rows_per_hospital
    description: "every hospital has at most 6 HRRP rows"
  - name: assert_condition_shares_sum_to_one
    description: "condition shares sum to 1 for every penalized hospital"
  - name: assert_condition_dollars_add_up
    description: "condition dollars add up to hospital dollars"
  - name: assert_penalty_at_most_3pct_of_base
    description: "no penalty above 3% of the base"
  - name: assert_unpenalized_have_zero_dollars
    description: "unpenalized hospitals (factor = 1) have $0"
  # Multi-year panel (mart.fct_hospital_condition_year)
  - name: assert_panel_zero_err_means_few_cases
    description: "pre-FY2019 rows with no ERR (CMS wrote 0) had fewer than 25 cases"
  - name: assert_panel_one_row_per_ccn_condition_year
    description: "panel has one row per CCN x condition x fiscal year"
  - name: assert_panel_peer_median_matches_cms
    description: "peer-group median ERR recomputed from the panel matches CMS's published median within 1e-6 (FY2019+, groups with 100+ hospitals)"
  - name: assert_panel_peer_median_constant_in_group
    description: "CMS's published peer median is one value per year x condition x peer group"
  - name: assert_panel_period_matches_file
    description: "config performance periods match the Start/End Date in CMS's file for every year we have it"
  - name: assert_panel_known_breaks_consistent
    description: "suppressed measures in the seed have no penalty indicator Y, and every measure that looks suppressed is in the seed"
  - name: assert_panel_covid_years_match_periods
    description: "COVID-2020 exclusion years in the seed are exactly the years whose period reaches Dec 2019 - Jun 2020"
  - name: assert_panel_matches_current_year_pipeline
    description: "panel's current-year rows equal what the single-year pipeline reads from the same CMS file"
