# CI: runs on every push and pull request. Never downloads from CMS, SEC or Census.
# It lints, unit-tests, then builds every model against a small DuckDB made from
# ~50 real hospitals checked into tests/fixtures/ (see tests/fixtures/README.md).
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:  # "Run workflow" button, e.g. for the bot's monthly refresh PR

permissions:
  contents: read

concurrency:  # a new push cancels the older run on the same branch
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip                          # reuse downloaded wheels between runs
          cache-dependency-path: pyproject.toml  # new cache when dependencies change

      - name: Install
        run: python -m pip install -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check .

      - name: Unit tests (pytest)
        run: pytest

      - name: Build the fixture DuckDB from tests/fixtures/raw/*.csv
        run: python -m ingest.fixtures build --db "$RUNNER_TEMP/fixture.duckdb"

      - name: Build models and run data tests on the fixture (dbt build)
        env:
          HRRP_DB_PATH: ${{ runner.temp }}/fixture.duckdb
        run: bash .github/scripts/build_models.sh
